<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Avend</title>
    </head>
    <body>
        <form method="post">
            <fieldset>
                <legend>Login</legend>
                <div>
                    <label for="text">Username</label>
                    <input name="Username" id="text" type="text" placeholder="more than 5 char" required>
                </div>
                <br>
                <div>
                    <label for="pwsd">Password</label>
                    <input name="Password" id="pswd" type="password" placeholder="4 num with uppercase char" required>
                </div>
                <br>
                <input type="submit" value="Submit">
            </fieldset>
        </form>
    </body>
</html>
