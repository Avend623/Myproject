<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Avend</title>
</head>
<body>
	<div>
		<label for="color">Colour</label>
		<input id="color" type="color">
	</div>
	<hr>
	<div>
		<label for="file">File</label>
		<input id="file" type="file" name="file">
	</div>
	<hr>
	<div>
		<label for="range">Range</label>
		<input value="3" step="1" min="0" max="10" id="range" type="range" name="range">
	</div>
	<hr>
	<div>
		<label for="number">Number</label>
		<input value="1" step="1" min="0" max="10" id="number" type="number" name="number">
	</div>
	<hr>
	<div>
		<label for="search">Search</label>
		<input id="search" type="search" name="search">
	</div>
	<hr>
	<div>
		<label for="url">URL</label>
		<input id="url" type="url" name="url">
	</div>
	<hr>
	<div>
		<label for="hidden">Hidden</label>
		<input id="hidden" type="hidden" name="hidden">
	</div>
	<hr>
	<div>
		<label for="month">Month</label>
		<input id="month" type="month" name="month">
	</div>
	<hr>
	<div>
		<label for="date">Date</label>
		<input id="date" type="date" name="date">
	</div>
	<hr>
	<div>
		<label for="time"><Time></Time></label>
		<input id="time" type="time" name="time">
	</div>
	<hr>
	<div>
		<label for="datetime-local">Datetime-local</label>
		<input id="datetime-local" type="datetime-local" name="datetime-local">
	</div>
	<hr>
	<div>
		<label for="week">Week</label>
		<input id="week" type="week" name="week">
	</div>
</body>
</html>
