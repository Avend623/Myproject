<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Avend</title>
</head>

<body>
	<form>
		<label for=""><b>What is your country?</b></label>
		<select name="country" id="cty">
			<optgroup label="Asia">
				<option value="Iraq">Iraq</option>
				<option value="Syria">Syria</option>
				<option value="Lebanon">Lebanon</option>
			</optgroup>
			<optgroup label="Europe" name="Europe">
				<option value="France">France</option>
				<option value="Germany">Germany</option>
				<option value="Italy">Italy</option>
			</optgroup>
			<optgroup label="Africa" name="Africa">
				<option value="Egypt">Egypt</option>
				<option value="Nigeria">Nigeria</option>
				<option value="South Africa">South Africa</option>
			</optgroup>
		</select>
		<input type="submit" value="Submit">
	</form>
	<br>
	<hr>
	<form>
		<label for="lang">What is your language?</label>
		<input id="lang" list="language" name="lang">
		<datalist id="language">
			<option value="c">
			<option value="c#">
			<option value="c++">
			<option value="java">
			<option value="python">
			<option value="javascript">
			<option value="php">
			<option value="ruby">
		</datalist>
		<input type="submit" value="Submit">
	</form>
	<br>
	<hr>
	<form>
		<label for="car">What is your car?</label>
		<select name="car" id="car">
			<option value="volvo">Volvo</option>
			<option value="saab">Saab</option>
			<option value="mercedes">Mercedes</option>
			<option value="audi">Audi</option>
		</select>
		<input type="submit" value="Submit">
</body>
</html>
