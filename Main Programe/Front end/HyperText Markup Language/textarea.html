<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Avend</title>
</head>
<body>
	<form target="_blank" novalidate>

			<input disabled autofocus type="text" value="Avend"
			maxlength="10" 
			placeholder="title"
			required name="title">

			<textarea name="content"

			rows="3" required></textarea>

			<input type="submit" value="Submit">
		</div>
	</form>
</body>
</html>
